<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Showcase App</title>
    <link rel="icon" href="./Showcase.ico">
    <link type="text/css" rel="stylesheet" href="styles.css">
    <link rel="preload" href="./composeResources/showcaseapp.composeapp.generated.resources/font/MiSansNormal.ttf" as="fetch" type="font/ttf" crossorigin>
</head>
<body>
<div id="showcase-app"></div>
<div id="showcase-startup" aria-busy="true">
    <div class="showcase-startup-content">
        <h1 id="showcase-startup-title">Make the screen yours.</h1>
        <div id="showcase-startup-progress" class="showcase-startup-progress" role="progressbar" aria-label="Loading" aria-valuemin="0" aria-valuemax="100" aria-valuenow="18">
            <span id="showcase-startup-progress-value"></span>
        </div>
        <p id="showcase-startup-status" role="status" aria-live="polite" aria-atomic="true">Loading</p>
        <p id="showcase-startup-hint">Preparing the resources Showcase needs to start.</p>

        <pre id="showcase-startup-error" hidden></pre>
        <button id="showcase-startup-retry" type="button" hidden>Reload</button>
        <noscript>JavaScript is required to open Showcase.</noscript>
    </div>
</div>
<script src="startup.js"></script>
<script id="showcase-app-script" type="application/javascript" src="ShowcaseApp.js"></script>
</body>
</html>
